<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מקראות ישראל – בחינה</title>
<style>
:root{--navy:#1a2744;--gold:#c8a84b;--gold-lt:#f0e2b6;--bg:#f7f5f0;--white:#fff;--green:#2d6a4f;--red:#8b2635;--text:#1a1a1a;--muted:#6b6b6b;--border:#ddd8cc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px;line-height:1.6}
@import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Heebo:wght@300;400;500&display=swap');
header{background:var(--navy);padding:22px 20px 16px;text-align:center;border-bottom:4px solid var(--gold)}
header h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(1.5rem,5vw,2.2rem);color:var(--gold)}
header p{color:#9eb3d6;font-size:.85rem;margin-top:3px;font-weight:300}
#chapter-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:14px 16px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.ch-btn{font-size:.78rem;font-weight:500;padding:5px 13px;border-radius:20px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);cursor:pointer;transition:background .15s,color .15s}
.ch-btn:hover,.ch-btn.active{background:var(--navy);color:var(--gold);border-color:var(--navy)}
#stats-bar{display:flex;justify-content:center;gap:22px;padding:10px 16px;background:var(--white);border-bottom:1px solid var(--border);font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.stat-num{font-weight:700;font-size:.95rem;color:var(--text)}.stat-num.green{color:var(--green)}.stat-num.red{color:var(--red)}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
#progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#progress-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
#progress-bar-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .3s ease;width:0%}
#progress-label{font-size:.76rem;color:var(--muted);white-space:nowrap}
#q-card{background:var(--white);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden}
#q-header{background:var(--navy);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
#q-counter{font-size:.78rem;color:#9eb3d6;font-weight:300}
#q-chapter-label{font-size:.74rem;color:var(--gold);font-family:'Frank Ruhl Libre',serif;font-weight:700}
#q-text{font-family:'Frank Ruhl Libre',serif;font-size:1.2rem;font-weight:400;line-height:1.65;padding:22px 20px 16px;border-bottom:1px solid var(--border)}
#options-list{padding:12px 16px 16px;display:flex;flex-direction:column;gap:9px}
.opt-btn{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:right;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:11px 13px;cursor:pointer;font-size:.94rem;line-height:1.5;color:var(--text);transition:border-color .15s,background .15s}
.opt-btn:hover:not(:disabled){border-color:var(--navy);background:var(--white)}
.opt-letter{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--navy);font-weight:700;font-size:.8rem;flex-shrink:0}
.opt-btn.correct{background:#eaf5ee;border-color:var(--green)}.opt-btn.correct .opt-letter{background:var(--green);color:var(--white)}
.opt-btn.wrong{background:#faeaea;border-color:var(--red)}.opt-btn.wrong .opt-letter{background:var(--red);color:var(--white)}
.opt-btn:disabled{cursor:default}
#feedback-box{display:none;margin:0 16px 14px;padding:13px 15px;border-radius:8px;font-size:.88rem;line-height:1.6}
#feedback-box.show{display:block}
#feedback-box.correct-fb{background:#eaf5ee;border-right:4px solid var(--green);color:#1a3d29}
#feedback-box.wrong-fb{background:#faeaea;border-right:4px solid var(--red);color:#4a1020}
#feedback-verdict{font-weight:700;font-size:.98rem;margin-bottom:4px}
#nav-row{display:flex;justify-content:space-between;align-items:center;padding:0 16px 18px;gap:8px}
.nav-btn{font-size:.88rem;font-weight:500;padding:9px 20px;border-radius:8px;border:none;cursor:pointer;transition:opacity .15s}
.nav-btn:disabled{opacity:.35;cursor:default}
#btn-prev{background:var(--border);color:var(--navy)}#btn-prev:not(:disabled):hover{background:#ccc8bc}
#btn-next{background:var(--navy);color:var(--white)}#btn-next:not(:disabled):hover{background:#243366}
#btn-skip{font-size:.78rem;background:none;border:1px dashed var(--border);color:var(--muted);padding:5px 11px;border-radius:6px;cursor:pointer;display:block;margin:0 auto 16px}
#btn-skip:hover{border-color:var(--navy);color:var(--navy)}
#result-screen{display:none;background:var(--white);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:32px 24px;text-align:center}
#result-screen.show{display:block}
#result-emoji{font-size:3rem;margin-bottom:10px}
#result-title{font-family:'Frank Ruhl Libre',serif;font-size:1.7rem;font-weight:900;color:var(--navy);margin-bottom:6px}
#result-score{font-size:2.8rem;font-weight:700;color:var(--gold);margin:8px 0}
#result-detail{color:var(--muted);font-size:.88rem;margin-bottom:20px}
.res-btn{font-size:.92rem;font-weight:500;padding:11px 26px;border-radius:8px;border:none;cursor:pointer;margin:4px}
#btn-restart{background:var(--navy);color:var(--white)}#btn-restart:hover{background:#243366}
#btn-retry{background:var(--red);color:var(--white);display:none}#btn-retry.show{display:inline-block}#btn-retry:hover{background:#6a1c28}
@media(max-width:480px){#q-text{font-size:1.05rem;padding:16px 14px 12px}.opt-btn{font-size:.88rem;padding:9px 11px}.nav-btn{padding:9px 14px}}
</style>
</head>
<body>
<header>
  <h1>מקראות ישראל – בחינה</h1>
  <p>בנק שאלות אינטראקטיבי לקצונה · בה"ד 1</p>
</header>

<div id="chapter-bar">
  <button class="ch-btn active" data-chapter="all">הכל</button>
  <button class="ch-btn" data-chapter="mk1">מקראות 1–3</button>
  <button class="ch-btn" data-chapter="mk4">מקראות 4–5</button>
  <button class="ch-btn" data-chapter="mk6">מקראות 6–7</button>
  <button class="ch-btn" data-chapter="m16">נשק M16</button>
  <button class="ch-btn" data-chapter="pro">נשק מקצועי</button>
  <button class="ch-btn" data-chapter="med">מע"רים</button>
  <button class="ch-btn" data-chapter="bm">ב"מ</button>
</div>

<div id="stats-bar">
  <div class="stat">סה"כ: <span id="stat-total" class="stat-num">0</span></div>
  <div class="stat">ענית: <span id="stat-answered" class="stat-num">0</span></div>
  <div class="stat">✓ <span id="stat-correct" class="stat-num green">0</span></div>
  <div class="stat">✗ <span id="stat-wrong" class="stat-num red">0</span></div>
</div>

<main>
  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    <div id="progress-label">0 / 0</div>
  </div>
  <div id="q-card">
    <div id="q-header">
      <span id="q-counter">שאלה 1</span>
      <span id="q-chapter-label">מקראות 1–3</span>
    </div>
    <div id="q-text">טוענת נתונים...</div>
    <div id="options-list"></div>
    <div id="feedback-box"></div>
    <div id="nav-row">
      <button class="nav-btn" id="btn-prev">→ הקודמת</button>
      <button class="nav-btn" id="btn-next">הבאה ←</button>
    </div>
  </div>
  <button id="btn-skip">דלג לשאלה שטרם ענית</button>
  <div id="result-screen">
    <div id="result-emoji"></div>
    <div id="result-title">סיימת!</div>
    <div id="result-score"></div>
    <div id="result-detail"></div>
    <button class="res-btn" id="btn-restart">התחל מחדש</button>
    <button class="res-btn" id="btn-retry">תרגל שגיאות</button>
  </div>
</main>

<script>
const CH={
  mk1:'מקראות 1–3',mk4:'מקראות 4–5',mk6:'מקראות 6–7',
  m16:'נשק M16',pro:'נשק מקצועי',med:'מע"רים',bm:'ב"מ'
};
const L=['א','ב','ג','ד','ה'];

const Q=[
/* ========== מקראות 1-3 ========== */
{c:'mk1',q:'מה תפקיד הקואליציה?',o:['לגבות בכנסת את צעדי הממשלה ולהגן על חקיקותיה','מתן רשות לערבים לשוב אל ארץ ישראל','מתן רשות לשוב ממצרים ולהקים את בית המקדש','מתן רשות לתחבורה ציבורית בשבת'],a:0,e:'הקואליציה מורכבת מכל המפלגות השותפות בממשלה, ותפקידה לגבות בכנסת את צעדי הממשלה ולהגן עליהם מול האופוזיציה.'},
{c:'mk1',q:'סמלי המדינה הם:',o:['דגל, סמל, המנון','סמל, דגל, מנורה','סמל, המנון ומגן-דוד','טלית, סמל, המנון'],a:0,e:'שלושת סמלי המדינה הרשמיים: הדגל (כחול-לבן עם מגן דוד), הסמל (מנורה+ענפי זית+ישראל), וההמנון (התקווה).'},
{c:'mk1',q:'היכן נוסד מרכז רוחני חליפי לאחר חורבן בית המקדש?',o:['ביבנה','בעכו','בטבריה','בנצרת'],a:0,e:'רבן יוחנן בן זכאי הקים ביבנה מרכז רוחני-הלכתי שהחליף את בית המקדש שחרב, והבטיח את המשך קיומה הרוחני של היהדות.'},
{c:'mk1',q:'איזו מילה לא נמצאת במגילת העצמאות?',o:['יהודית','דמוקרטית','ציונית','שואה'],a:1,e:'הצירוף "יהודית ודמוקרטית" הופיע לראשונה בחוקי היסוד מ-1992. המילה "דמוקרטית" עצמה אינה במגילת העצמאות.'},
{c:'mk1',q:'במה עוסק בג"ץ?',o:['תביעה של אזרחים נגד אזרחים','עתירות נגד הצבא','עתירות של מי שנפגעו מפעולות המדינה','עתירות שמגישה המדינה נגד אזרחים'],a:2,e:'בג"ץ דן בעתירות של אזרחים הרואים עצמם נפגעים מפעולות המדינה, כולל עתירות נגד חוקים ומדיניות ממשלתית.'},
{c:'mk1',q:'שלושת התפילות ביום חול הן:',o:['שחרית, מנחה, ערבית','מנחה, ערבית, נעילה','שחרית, מנחה, כל נדרי','כל נדרי, נעילה, ערבית'],a:0,e:'שלוש תפילות היום: שחרית (בוקר), מנחה (אחה"צ), ערבית (ערב). נעילה וכל נדרי הן תפילות מיוחדות ליום הכיפורים.'},
{c:'mk1',q:'במהלך איזה חג מתקיימת "שמחת בית השואבה"?',o:['פסח','חנוכה','שבועות','סוכות'],a:3,e:'שמחת בית השואבה נערכה בימי חול המועד סוכות בזמן שבית המקדש היה קיים, כחלק מטקס ניסוך המים – וכללה נגינה וריקודים.'},
{c:'mk1',q:'במה עסק חיבורו של הרמב"ם "משנה תורה"?',o:['הלכה','פירוש המקרא','תלמוד','אמונה'],a:0,e:'משנה תורה ("היד החזקה") הוא חיבור הלכתי מקיף של הרמב"ם, המסדר את כלל ההלכות היהודיות באופן שיטתי וברור.'},
{c:'mk1',q:'מה היא שנה מעוברת?',o:['שנה רגילה','שנה בת 11.5 חודשים','שנה בת 13 חודשים','שנה בת 11 חודשים'],a:2,e:'בגלל הפער בין מחזור הירח לשמש, פעם בכשלוש שנים מתווסף חודש אדר ב\' והשנה נהיית בת 13 חודשים.'},
{c:'mk1',q:'מה קובע עקרון הפרדת רשויות?',o:['הפרדה ופיזור הכח בין שלוש רשויות שלטון','הפרדת הכוח בין קואליציה לאופוזיציה','כלל הרשויות תחת רשות מרכזית אחת','כל רשות עומדת לבדה ופועלת כרצונה'],a:0,e:'הפרדת הרשויות: מחוקקת (כנסת), מבצעת (ממשלה), שופטת (בתי משפט) – מאזנות ובולמות זו את זו.'},
{c:'mk1',q:'מה אוכל למצוא ב"שולחן ערוך"?',o:['חוקים, דינים ומצוות','חוקים ומצוות','מצוות ודינים','דינים וחוקים'],a:0,e:'השולחן ערוך (ר\' יוסף קארו) הוא ספר ההלכה המרכזי ומקיף חוקים, דינים ומצוות מכל תחומי החיים.'},
{c:'mk1',q:'מה היא הרשות המחוקקת בישראל?',o:['בית המשפט העליון','המדינה','הממשלה','הכנסת'],a:3,e:'הכנסת (120 חברים) היא הרשות המחוקקת – חוקקת חוקים ומפקחת על הממשלה.'},
{c:'mk1',q:'מהי דתם של הצ\'רקסים?',o:['מוסלמים','דרוזים','נוצרים','בדואים'],a:0,e:'הצ\'רקסים ("אדיגים") הם עם קווקזי מוסלמי סוני השומר על שפה ומסורות ייחודיות.'},
{c:'mk1',q:'באיזה תקופה פעל הרמב"ם?',o:['תור הזהב','תקופת הראשונים','תקופת התלמוד','תקופת הגאונים'],a:1,e:'הרמב"ם (1135-1204) פעל בתקופת הראשונים – הפרשנים וההוגים שבין תקופת הגאונים לתחילת העת החדשה.'},
{c:'mk1',q:'מה קובע חוק השבות?',o:['כל אדם הרוצה להיות יהודי יכול','לכל יהודי יש הזכות לעלות לארץ','כל יהודי בגלות זכאי להטבות','כל יהודי זכאי לכסף ממדינת ישראל'],a:1,e:'חוק השבות (1950) מעניק לכל יהודי הזכות לעלות לישראל ולקבל אזרחות.'},
{c:'mk1',q:'האם מותר לחיילי צה"ל להביע עמדות פוליטיות?',o:['חל איסור כולל לקבוע עמדות פוליטיות','מותר לחיילים להביע עמדות פוליטיות'],a:0,e:'פקודות צה"ל אוסרות על חיילים להביע עמדות פוליטיות בציבור בשירותם – לשמור על אופיו הא-פוליטי של הצבא.'},
{c:'mk1',q:'מה דתם של מרבית ערביי ישראל?',o:['בדואים','מוסלמים שיעים','דרוזים','מוסלמים סונים'],a:3,e:'רוב ערביי ישראל הם מוסלמים סונים.'},
{c:'mk1',q:'מי ייסד את ההסתדרות הציונית העולמית ומתי?',o:['הרצל בקונגרס הציוני הראשון 1897','הרצל בקונגרס החמישי 1901','דוד בן גוריון עם הקמת המדינה','הרצל בקונגרס השמונה-עשרה 1933'],a:0,e:'הרצל כינס את הקונגרס הציוני הראשון בבאזל 1897 ובו הוקמה ההסתדרות הציונית העולמית.'},
{c:'mk1',q:'לאיזה מועד קשורה דמותו של אנטיוכוס אפיפנס?',o:['פורים','ל"ג בעומר','חנוכה','פסח'],a:2,e:'אנטיוכוס אפיפנס היה המלך היווני-סלווקי שגזרותיו עוררו את מרד החשמונאים – בסיס חג החנוכה.'},
{c:'mk1',q:'במה עסקו מרבית הבדואים באופן מסורתי?',o:['במרעה','בציד','גידול זיתים','גידול חיטה'],a:0,e:'הבדואים היו שבטים נודדים שעסקו במרעה – עיסוק שחייב נדידה מתמדת בחיפוש שטחי מרעה.'},
{c:'mk1',q:'כיצד מכונים יהודים שנאלצו להתנצר בספרד?',o:['מתבוללים','אנוסים','מתנצרים','מעוקרים'],a:1,e:'אנוסים – יהודים שנאלצו בכוח להתנצר (בעיקר בספרד ופורטוגל) אך רבים המשיכו לשמור מצוות בסתר.'},
{c:'mk1',q:'למי עבר מקל ההנהגה עם הכניסה לארץ?',o:['ירבעם בן נבט','דוד','יהושע בן נון','רחבעם'],a:2,e:'יהושע בן נון היה ממשיכו של משה, והוא הוביל את בני ישראל בכניסה לארץ ישראל וכיבושה.'},
{c:'mk1',q:'מה ההבדל בין התורה שבכתב לתורה שבעל-פה?',o:['התנ"ך מול ההלכה','התורה מול פירושיה','התנ"ך מול המשנה','התנ"ך מול כל הפירושים שלו'],a:3,e:'תורה שבכתב = התנ"ך. תורה שבעל-פה (משנה, תלמוד ועוד) = מבארת ומפרשת אותה בפרטים שלא נכתבו.'},
{c:'mk1',q:'איזה ספר חובר ע"י יוסף קארו?',o:['שולחן ערוך','התלמוד','משנה','ברייתא'],a:0,e:'ר\' יוסף קארו חיבר את השולחן ערוך – ספר ההלכה המרכזי של העם היהודי עד היום.'},
{c:'mk1',q:'מיהו רחבעם?',o:['מלך ישראל','מלך יהודה בנו של דוד','מלך ישראל נכדו של שלמה','מלך יהודה נכדו של דוד'],a:3,e:'רחבעם – בנו של שלמה המלך ונכדו של דוד. בתקופתו התפלגה הממלכה למדינת יהודה ומדינת ישראל.'},

/* ======= STATE ======= */
let currentCh='all', activeQ=[], curIdx=0, answers={}, nCorrect=0, nWrong=0;

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function load(ch,override){
  currentCh=ch; answers={}; nCorrect=0; nWrong=0;
  activeQ=override?override: ch==='all'?shuffle([...Q]):shuffle(Q.filter(q=>q.c===ch));
  document.querySelectorAll('.ch-btn').forEach(b=>b.classList.toggle('active',b.dataset.chapter===ch));
  curIdx=0;
  updateStats();
  show(0);
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('q-card').style.display='';
  document.getElementById('btn-skip').style.display='';
  document.getElementById('progress-wrap').style.display='';
}

function show(idx){
  curIdx=idx;
  const q=activeQ[idx]; if(!q)return;
  const ans=answers[idx];
  document.getElementById('q-chapter-label').textContent=CH[q.c]||q.c;
  document.getElementById('q-counter').textContent=`שאלה ${idx+1} מתוך ${activeQ.length}`;
  document.getElementById('q-text').textContent=q.q;
  const list=document.getElementById('options-list'); list.innerHTML='';
  q.o.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    if(ans!==undefined){
      btn.disabled=true;
      if(i===q.a)btn.classList.add('correct');
      else if(i===ans&&i!==q.a)btn.classList.add('wrong');
    }
    btn.innerHTML=`<span class="opt-letter">${L[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click',()=>pick(i));
    list.appendChild(btn);
  });
  const fb=document.getElementById('feedback-box');
  if(ans!==undefined){
    const ok=ans===q.a;
    fb.className='feedback-box show '+(ok?'correct-fb':'wrong-fb');
    fb.innerHTML=`<div id="feedback-verdict">${ok?'✓ נכון!':'✗ לא נכון'}</div><div>${q.e}</div>`;
  }else{fb.className='feedback-box';fb.innerHTML='';}
  document.getElementById('btn-prev').disabled=(idx===0);
  document.getElementById('btn-next').disabled=(idx>=activeQ.length-1);
  const done=Object.keys(answers).length;
  document.getElementById('progress-bar-fill').style.width=(activeQ.length?(done/activeQ.length*100):0)+'%';
  document.getElementById('progress-label').textContent=`${done} / ${activeQ.length}`;
}

function pick(i){
  if(answers[curIdx]!==undefined)return;
  answers[curIdx]=i;
  if(i===activeQ[curIdx].a)nCorrect++;else nWrong++;
  updateStats(); show(curIdx);
  const delay=i===activeQ[curIdx].a?1400:2500;
  setTimeout(()=>{
    if(curIdx<activeQ.length-1)show(curIdx+1);else result();
  },delay);
}

function updateStats(){
  document.getElementById('stat-total').textContent=activeQ.length;
  document.getElementById('stat-answered').textContent=Object.keys(answers).length;
  document.getElementById('stat-correct').textContent=nCorrect;
  document.getElementById('stat-wrong').textContent=nWrong;
}

function result(){
  document.getElementById('q-card').style.display='none';
  document.getElementById('btn-skip').style.display='none';
  document.getElementById('progress-wrap').style.display='none';
  const pct=Math.round(nCorrect/activeQ.length*100);
  document.getElementById('result-emoji').textContent=pct>=80?'🎉':pct>=60?'👍':'📚';
  document.getElementById('result-title').textContent=pct>=80?'מצוין!':pct>=60?'טוב! עוד קצת':'יש להתחזק';
  document.getElementById('result-score').textContent=pct+'%';
  document.getElementById('result-detail').textContent=`${nCorrect} נכון מתוך ${activeQ.length} · ${nWrong} שגיאות`;
  const rb=document.getElementById('btn-retry');
  nWrong>0?rb.classList.add('show'):rb.classList.remove('show');
  document.getElementById('result-screen').classList.add('show');
}

document.querySelectorAll('.ch-btn').forEach(b=>b.addEventListener('click',()=>load(b.dataset.chapter)));
document.getElementById('btn-prev').addEventListener('click',()=>{if(curIdx>0)show(curIdx-1);});
document.getElementById('btn-next').addEventListener('click',()=>{if(curIdx<activeQ.length-1)show(curIdx+1);});
document.getElementById('btn-skip').addEventListener('click',()=>{
  for(let i=0;i<activeQ.length;i++){const j=(curIdx+1+i)%activeQ.length;if(answers[j]===undefined){show(j);return;}}
});
document.getElementById('btn-restart').addEventListener('click',()=>load(currentCh));
document.getElementById('btn-retry').addEventListener('click',()=>{
  const wrong=activeQ.filter((_,i)=>answers[i]!==undefined&&answers[i]!==activeQ[i].a);
  load(currentCh,shuffle(wrong));
});
document.addEventListener('keydown',e=>{
  if(answers[curIdx]!==undefined){
    if(e.key==='ArrowRight'&&curIdx>0)show(curIdx-1);
    if(e.key==='ArrowLeft'&&curIdx<activeQ.length-1)show(curIdx+1);
    return;
  }
  const m={'1':0,'2':1,'3':2,'4':3,'א':0,'ב':1,'ג':2,'ד':3};
  if(m[e.key]!==undefined)pick(m[e.key]);
});
